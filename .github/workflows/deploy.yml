name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: Build and load Docker image locally
        run: |
          cd backend
          docker build -t ghcr.io/ahmed-lotfy-dev/selftracker:latest .
          docker save ghcr.io/ahmed-lotfy-dev/selftracker:latest | docker load

      - name: Deploy with docker compose
        run: |
          cd /home/ubuntu/apps/selftracker
          docker compose up -d --pull never
          docker image prune -f
